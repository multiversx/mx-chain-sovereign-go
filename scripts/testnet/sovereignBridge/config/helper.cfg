CONFIG_FILE=$SCRIPT_PATH/config/configs.cfg

manualUpdateConfigFile() {
  source $SCRIPT_PATH/config/configs.cfg
}

function updateConfig {
  TARGET_KEY=$1
  REPLACEMENT_VALUE=$2
  sed "s/^$TARGET_KEY=.*/$TARGET_KEY=$REPLACEMENT_VALUE/" $CONFIG_FILE > $SCRIPT_PATH/config/temp.x
  mv $SCRIPT_PATH/config/temp.x "$CONFIG_FILE"
  source $CONFIG_FILE
}

checkVariables() {
    VAR_UNSET=""
    VARIABLE_NAMES=("$@")
    for VARIABLE_NAME in "${VARIABLE_NAMES[@]}"; do
        [ -z "${!VARIABLE_NAME}" ] && echo "$VARIABLE_NAME variable is unset." && VAR_UNSET=true
    done
    [ -n "$VAR_UNSET" ] && return 1
    return 0
}

printTxStatus() {
    local FILE=$1
    local TX_HASH=$(mxpy data parse --file="${FILE}" --expression="data['emittedTransactionHash']")
    if [ -z "$TX_HASH" ]; then
        echo "No transaction hash found in file"
        return 1
    fi

    local TX_STATUS=""
    local RETRIES=0
    local MAX_RETRIES=6

    while [ -z "$TX_STATUS" ] && [ $RETRIES -lt $MAX_RETRIES ]; do
        TX_STATUS=$(curl -s "${PROXY}/transaction/${TX_HASH}/process-status" | jq -r '.data.status')

        if [ -z "$TX_STATUS" ]; then
            echo "Status not available yet, retrying in 1s..."
            sleep 1
            ((RETRIES++))
        fi
    done

    if [ "$TX_STATUS" != "success" ]; then
        echo "Transaction was not successful"
        echo "You can see the log at: ${FILE}"
        return 1
    fi

    echo "Transaction was successful"
    return 0
}

hexToString() {
    echo -n "$1" | xxd -r -p
}

generateRandomChainId() {
    local LEN=$(shuf -i 1-4 -n 1)
    echo $(cat /dev/urandom | tr -dc 'a-z0-9' | head -c $LEN)
}
