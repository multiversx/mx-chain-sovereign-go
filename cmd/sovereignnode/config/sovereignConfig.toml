[ExtendedShardHdrNonceHashStorage]
    [ExtendedShardHdrNonceHashStorage.Cache]
        Name = "ExtendedShardHdrNonceHashStorage"
        Capacity = 1000
        Type = "SizeLRU"
        SizeInBytes = 3145728 #3MB
    [ExtendedShardHdrNonceHashStorage.DB]
        FilePath = "ExtendedShardHdrNonceHash"
        Type = "LvlDBSerial"
        BatchDelaySeconds = 2
        MaxBatchSize = 100
        MaxOpenFiles = 10


[ExtendedShardHeaderStorage]
    [ExtendedShardHeaderStorage.Cache]
        Name = "ExtendedShardHeaderStorage"
        Capacity = 1000
        Type = "SizeLRU"
        SizeInBytes = 3145728 #3MB
    [ExtendedShardHeaderStorage.DB]
        FilePath = "ExtendedShardHeader"
        Type = "LvlDBSerial"
        BatchDelaySeconds = 2
        MaxBatchSize = 100
        MaxOpenFiles = 10

[MainChainNotarization]
    # This defines the starting round from which all sovereign chain nodes should starting notarizing main chain headers
    [MainChainNotarization.MVX]
        StartRound = 11

    [MainChainNotarization.ETH]
        StartRound = 12

    #[MainChainNotarization.SUI]
    #    StartRound = 13

[OutgoingSubscribedEvents]
    # Time to wait in seconds for outgoing operations that need to be bridged from sovereign chain to main chain.
    # If no confirmation of bridged data is received after this time, next leader should retry sending data.
    TimeToWaitForUnconfirmedOutGoingOperationInSeconds = 90

    # The subscribed events represent a set of events on the sovereign chain that, when detected, trigger an outgoing
    # operation towards the main chain. This operation is materialized as a transaction on the main chain. The outgoing
    # bridge service that processes these events must be able to recognize them and construct the corresponding
    # transactions according to the target chain and bridge contracts.
    SubscribedEvents = [
        # Subscribtion to make cross chain transfers from sovereign to main chain
        { Identifier = "deposit", Addresses = ["erd1qyu5wthldzr8wx5c9ucg8kjagg0jfs53s8nr3zpz3hypefsdd8ssycr6th"] },
        # Subscribtion to generate a token registration to be bridged from sovereign to main chain
        { Identifier = "registerToken", Addresses = ["erd1qyu5wthldzr8wx5c9ucg8kjagg0jfs53s8nr3zpz3hypefsdd8ssycr6th"] },
        # Subscribtion to send event(bls key + assigned ID) from sovereign to main chain when a new bls key is staked in sovereign
        # Address that emits these events should be vm StakingSCAddress
        { Identifier = "registerBlsKey", Addresses = ["erd1qqqqqqqqqqqqqqqpqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqllls0lczs7"] }
    ]

[OutGoingBridge]
    # This flag enables or disables the outgoing bridge service connection.
    # When disabled, the node will not send the outgoing operations to the bridge service.
    Enabled = false
    GRPCHost = "localhost"
    GRPCPort = "8085"
    # Hasher type for outgoing operations
    Hasher = "sha256"

[NotifierConfig]
    # This flag indicates whether the node will establish a WebSocket receiver connection from a light node or observer.
    # Running an additional main chain light node as a notifier requires extra hardware resources.
    # When disabled, the node will rely on and trust incoming headers from the main chain proposed by other leaders.
    # Disabling this flag can be useful in scenarios where additional validation infrastructure isn't necessary.
    Enabled = true

    SubscribedEvents = [
        { Identifier = "deposit", Addresses = ["erd1qyu5wthldzr8wx5c9ucg8kjagg0jfs53s8nr3zpz3hypefsdd8ssycr6th"] },
        { Identifier = "execute", Addresses = ["erd1qyu5wthldzr8wx5c9ucg8kjagg0jfs53s8nr3zpz3hypefsdd8ssycr6th"] },
        { Identifier = "changeValidatorSet", Addresses = ["erd1qyu5wthldzr8wx5c9ucg8kjagg0jfs53s8nr3zpz3hypefsdd8ssycr6th"] }
    ]

    [NotifierConfig.WebSocket]
        Url = "ws://localhost:22111"
        # Possible values: json, gogo protobuf. Should be compatible with mx-chain-node outport driver config
        MarshallerType = "gogo protobuf"
        # Retry duration (receive/send ack signal) in seconds
        RetryDuration = 5
        # Signals if in case of data payload processing error, we should send the ack signal or not
        BlockingAckOnError = false
        # Possible values: sha256, keccak, blake2b. Should be compatible with mx-chain-node outport driver config
        HasherType = "blake2b"
        # This flag describes the mode to start the WebSocket connector. Can be "client" or "server"
        Mode = "client"
        # This flag specifies if we should send an acknowledge signal upon receiving data
        WithAcknowledge = true
        # The duration in seconds to wait for an acknowledgement message
        AcknowledgeTimeout = 60
        # Payload version to process
        Version = 1

    [NotifierConfig.AddressPubKeyConverter]
        Length = 32
        Hrp = "erd"

[ETHNotifierConfig]
    Enabled = true
    SubscribedEvents = [
        # Identifier = Event's topic signature, e.g.:  event Deposit(address indexed user, uint256 amount);
        # Address = SC's address
        { Identifier = "Deposit(address,uint256)", Address = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2" }
    ]

    # Possible values: sha256, keccak, blake2b. Should be compatible with sovereign nodes
    HasherType = "blake2b"

    # Possible values: json, gogo protobuf. Should be compatible with sovereign nodes
    MarshallerType = "gogo protobuf"

    # Defines the min number confirmations for a block to be considered final.
    # Under normal conditions, an ETH block time ~= 12s and a chain reorganization should not happen after > 6.5 mins
    # For ETH mainnet, probably around 32 blocks confirmation should be enough (~6.5 mins)
    MinBlocksConfirmation = 2

    # Defines block cache size. If we have an average of a block/12s, then in 10 minutes, cache size should be ~= 50.
    # For a cache size = 1000, we would hold blocks from the past ~3h.
    BlockCacheSize = 1000

    URL = "wss://rpc.sepolia.org"


[GenesisConfig]
    # NativeESDT specifies the sovereign shard's native esdt currency
    NativeESDT = "WEGLD-a1b2c3"
